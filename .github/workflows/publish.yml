name: Publish @virstak/ui to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify release tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify types, tests and packed package
        run: npm run verify:release

      - name: Install Chromium for browser package tests
        run: npx --no-install playwright install --with-deps chromium

      - name: Verify package in browser
        run: npm run verify:browser:package

      - name: Ensure npm CLI supports OIDC
        run: npm install --global npm@^11

      - name: Publish using npm Trusted Publishing (OIDC)
        run: npm publish --access public
